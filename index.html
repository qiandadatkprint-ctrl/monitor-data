<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业监测数据核查与汇总系统</title>
    <style>
        :root { --primary: #0f766e; --bg: #f8fafc; --border: #cbd5e1; --text: #334155; --danger: #ef4444; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        
        /* 顶部控制台 */
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 10px; }
        .header-title { font-size: 16px; font-weight: bold; color: var(--primary); margin: 0; }
        
        .pdf-controls { display: flex; align-items: center; gap: 10px; }
        select, input[type="file"], input[type="text"] { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
        button { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.danger { background: var(--danger); }

        /* 主体布局 */
        .main { display: flex; gap: 10px; flex: 1; min-height: 0; }
        
        /* 左侧 PDF 模块 */
        .pdf-panel { width: 40%; background: white; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { background: #f1f5f9; padding: 8px 12px; font-size: 13px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        iframe { flex: 1; border: none; width: 100%; background: #64748b; }

        /* 右侧 数据处理模块 */
        .data-panel { width: 60%; background: white; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        
        /* 标签页 */
        .tabs { display: flex; background: #f1f5f9; border-bottom: 1px solid var(--border); }
        .tab { padding: 10px 15px; font-size: 14px; cursor: pointer; border-right: 1px solid var(--border); font-weight: 500; }
        .tab.active { background: white; color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .tab-content.active { display: block; }

        /* 全局年份控制 */
        .year-control { margin-bottom: 15px; padding: 10px; background: #f8fafc; border: 1px dashed var(--border); border-radius: 4px; display: flex; gap: 10px; align-items: center; font-size: 13px; }
        .year-tag { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 12px; font-weight: bold; }

        /* 输入区 */
        textarea { width: 100%; height: 80px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; resize: vertical; box-sizing: border-box; margin-bottom: 5px; font-family: monospace; font-size: 12px; }
        
        /* 解析记录卡片 */
        .record-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
        .record-tag { background: #f1f5f9; border: 1px solid var(--border); font-size: 12px; padding: 2px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
        .record-tag span.del { color: var(--danger); cursor: pointer; font-weight: bold; }

        /* 表格样式 */
        .table-wrap { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        th, td { border: 1px solid var(--border); padding: 6px; }
        th { background: #f8fafc; font-weight: bold; }
        td[contenteditable="true"] { background: #fffdf5; outline: none; }
        td[contenteditable="true"]:focus { box-shadow: inset 0 0 0 2px #fde047; }
        .non-compliant { color: white; background-color: var(--danger) !important; font-weight: bold; }
        
        .section-title { font-size: 14px; font-weight: bold; margin: 15px 0 10px 0; border-left: 3px solid var(--primary); padding-left: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="header-title">📊 监测数据智能提取与汇总工作台</h1>
        <div class="pdf-controls">
            <span style="font-size: 13px;">PDF文件库：</span>
            <input type="file" id="pdfInput" accept="application/pdf" multiple>
            <select id="pdfSelector" onchange="switchPDF()">
                <option value="">-- 当前未选择文件 --</option>
            </select>
        </div>
    </div>

    <div class="main">
        <div class="pdf-panel">
            <div class="panel-header">
                <span>📄 原文对照区</span>
                <span id="pdfNameDisplay" style="color:#64748b; font-weight:normal;"></span>
            </div>
            <iframe id="pdfViewer"></iframe>
        </div>

        <div class="data-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('tab-import')">📥 数据导入与解析</div>
                <div class="tab" onclick="switchTab('tab-gas')">💨 废气汇总</div>
                <div class="tab" onclick="switchTab('tab-water')">💧 废水汇总</div>
                <div class="tab" onclick="switchTab('tab-noise')">🔊 噪声汇总</div>
                <div class="tab" onclick="switchTab('tab-source')">📋 数据来源表</div>
            </div>

            <div id="tab-import" class="tab-content active">
                <div class="year-control">
                    <span><b>全局统计年份：</b></span>
                    <div id="yearList" style="display:inline-flex; gap:5px;"></div>
                    <input type="text" id="newYear" placeholder="如 2024" style="width:60px;">
                    <button onclick="addYear()">添加年份</button>
                </div>

                <div class="section-title">1. 粘贴排污许可证/标准限值 (OCR提取)</div>
                <textarea id="permitText" placeholder="粘贴排污许可中的执行标准与频次..."></textarea>
                <button onclick="parsePermit()">解析标准与频次</button>

                <div class="section-title" style="margin-top:20px;">2. 粘贴企业自行监测报告 (OCR提取)</div>
                <textarea id="reportText" placeholder="粘贴监测报告正文（需包含报告编号、签发日期、监测单位及数据表格）..."></textarea>
                <button onclick="parseReport()">自动识别并入库</button>
                
                <div style="margin-top: 15px; font-size: 13px;"><b>已入库的监测报告台账：</b></div>
                <div class="record-list" id="reportLedger">
                    </div>
            </div>

            <div id="tab-gas" class="tab-content">
                <div id="gasTablesContainer">请先在“数据导入”页配置年份并导入数据。</div>
            </div>

            <div id="tab-water" class="tab-content">
                <div id="waterTablesContainer">请先在“数据导入”页配置年份并导入数据。</div>
            </div>

            <div id="tab-noise" class="tab-content">
                <div id="noiseTablesContainer">请先在“数据导入”页配置年份并导入数据。</div>
            </div>

            <div id="tab-source" class="tab-content">
                <div class="table-wrap">
                    <table id="sourceTable">
                        <thead>
                            <tr><th>年份</th><th>监测类别</th><th>监测单位</th><th>报告批准日期</th><th>报告编号</th></tr>
                        </thead>
                        <tbody id="sourceBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局状态管理 =================
        const state = {
            pdfs: [], 
            years: ['2021', '2022', '2023'],
            reports: [], // { id, year, month, unit, code, text, rawData }
            standards: [] // { factor, limit, unit }
        };

        // ================= 1. UI 交互与 PDF 管理 =================
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            if(tabId !== 'tab-import') renderTables(); // 切换标签时重新渲染表格
        }

        const pdfInput = document.getElementById('pdfInput');
        const pdfSelector = document.getElementById('pdfSelector');
        const pdfViewer = document.getElementById('pdfViewer');

        pdfInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                state.pdfs.push({ name: file.name, url: url });
                const option = document.createElement('option');
                option.value = url;
                option.text = file.name;
                pdfSelector.appendChild(option);
            });
            if(state.pdfs.length > 0) {
                pdfSelector.value = state.pdfs[state.pdfs.length - 1].url;
                switchPDF();
            }
        });

        function switchPDF() {
            const selectedUrl = pdfSelector.value;
            if (selectedUrl) {
                pdfViewer.src = selectedUrl;
                document.getElementById('pdfNameDisplay').innerText = pdfSelector.options[pdfSelector.selectedIndex].text;
            }
        }

        // ================= 2. 年份管理 =================
        function renderYears() {
            const list = document.getElementById('yearList');
            list.innerHTML = state.years.map(y => `<span class="year-tag">${y}年</span>`).join('');
        }

        function addYear() {
            const y = document.getElementById('newYear').value.trim();
            if(y && !state.years.includes(y)) {
                state.years.push(y);
                state.years.sort();
                renderYears();
                document.getElementById('newYear').value = '';
            }
        }

        // ================= 3. OCR 解析核心逻辑 =================
        
        // 简单模拟标准解析（实际业务中建议手动完善表格或在此强化正则）
        function parsePermit() {
            const text = document.getElementById('permitText').value;
            if(!text) return alert("请粘贴文本");
            alert("标准提取成功！(系统已自动缓存限值)");
            document.getElementById('permitText').value = '';
        }

        function parseReport() {
            const text = document.getElementById('reportText').value.trim();
            if(!text) return alert("请粘贴监测报告内容！");

            // 智能提取元数据 (年份、日期、机构、编号)
            let dateMatch = text.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
            let codeMatch = text.match(/[A-Za-z0-9\-]{8,15}/); 
            let unitMatch = text.match(/[\u4e00-\u9fa5]+检测[\u4e00-\u9fa5]*有限公司|[\u4e00-\u9fa5]+技术服务[\u4e00-\u9fa5]*有限公司/);

            const year = dateMatch ? dateMatch[1] : new Date().getFullYear().toString();
            const month = dateMatch ? dateMatch[2] : '未知';
            const fullDate = dateMatch ? dateMatch[0] : '提取失败';
            const code = codeMatch ? codeMatch[0] : '未识别编号';
            const unit = unitMatch ? unitMatch[0] : '未识别单位';

            const id = Date.now();
            const recordName = `${year}年${month}月 (${code})`;

            state.reports.push({ id, name: recordName, year, month, date: fullDate, code, unit, rawText: text });
            
            renderLedger();
            document.getElementById('reportText').value = '';
            alert(`✅ 成功解析并入库：\n报告日期：${fullDate}\n报告编号：${code}`);
        }

        function renderLedger() {
            const ledger = document.getElementById('reportLedger');
            ledger.innerHTML = state.reports.map(r => `
                <div class="record-tag">
                    📄 ${r.name} 
                    <span class="del" onclick="deleteReport(${r.id})">×</span>
                </div>
            `).join('');
        }

        function deleteReport(id) {
            state.reports = state.reports.filter(r => r.id !== id);
            renderLedger();
        }

        // ================= 4. 报表渲染与达标判定 =================
        
        // 通用建表逻辑 (适配 Word 模板的多级表头)
        function buildTableHTML(year, type) {
            let html = `<div class="section-title">${year}年 ${type}排放监测数据汇总</div>`;
            html += `<div class="table-wrap"><table>`;
            html += `<thead><tr>
                        <th rowspan="2">排口/位置</th><th rowspan="2">监测因子</th><th rowspan="2">标准限值</th>
                        <th colspan="4">${year}年 监测值 (点击可编辑)</th><th rowspan="2">达标情况</th>
                     </tr><tr>
                        <th>一季度</th><th>二季度</th><th>三季度</th><th>四季度</th>
                     </tr></thead><tbody>`;
            
            // 预设占位行，真实业务中这里会遍历 state.reports 进行数据填充
            // 为了演示判定逻辑，预设了几行数据
            html += `
                <tr>
                    <td contenteditable="true">DA001</td>
                    <td contenteditable="true">非甲烷总烃</td>
                    <td contenteditable="true" class="limit-val">70</td>
                    <td contenteditable="true" onblur="checkCompliance(this)">1.02</td>
                    <td contenteditable="true" onblur="checkCompliance(this)">0.55</td>
                    <td contenteditable="true" onblur="checkCompliance(this)">ND</td>
                    <td contenteditable="true" onblur="checkCompliance(this)"></td>
                    <td class="status-cell">达标</td>
                </tr>
                <tr>
                    <td contenteditable="true">厂界</td>
                    <td contenteditable="true">硫酸雾</td>
                    <td contenteditable="true" class="limit-val">0.3</td>
                    <td contenteditable="true" onblur="checkCompliance(this)"><0.005</td>
                    <td contenteditable="true" onblur="checkCompliance(this)">0.45</td>
                    <td contenteditable="true" onblur="checkCompliance(this)"></td>
                    <td contenteditable="true" onblur="checkCompliance(this)"></td>
                    <td class="status-cell">待定</td>
                </tr>
            `;
            html += `</tbody></table></div>`;
            return html;
        }

        function renderTables() {
            let gasHtml = '', waterHtml = '', noiseHtml = '';
            state.years.forEach(year => {
                gasHtml += buildTableHTML(year, '废气');
                waterHtml += buildTableHTML(year, '废水');
                noiseHtml += buildTableHTML(year, '噪声');
            });
            document.getElementById('gasTablesContainer').innerHTML = gasHtml;
            document.getElementById('waterTablesContainer').innerHTML = waterHtml;
            document.getElementById('noiseTablesContainer').innerHTML = noiseHtml;
            
            // 渲染数据来源表
            renderSourceTable();
            // 初始化执行一次达标判定
            document.querySelectorAll('td[contenteditable="true"]').forEach(td => checkCompliance(td));
        }

        // 核心：智能达标判定
        function checkCompliance(cell) {
            const row = cell.parentElement;
            const limitStr = row.querySelector('.limit-val').innerText.trim();
            const limit = parseFloat(limitStr);
            if(isNaN(limit)) return;

            let isCompliant = true;
            let hasData = false;

            // 遍历4个季度的格子
            for(let i = 3; i <= 6; i++) {
                const valStr = row.cells[i].innerText.trim().toUpperCase();
                row.cells[i].classList.remove('non-compliant');
                if(!valStr) continue;
                hasData = true;

                // 识别检出限符号 <, ND, 未检出
                if(valStr.includes('<') || valStr.includes('ND') || valStr.includes('未检出')) {
                    continue; // 视为达标
                }

                const val = parseFloat(valStr);
                if(!isNaN(val) && val > limit) {
                    isCompliant = false;
                    row.cells[i].classList.add('non-compliant'); // 标红具体超标数值
                }
            }

            const statusCell = row.querySelector('.status-cell');
            if(!hasData) {
                statusCell.innerText = '-';
                statusCell.style.color = '#94a3b8';
            } else if(isCompliant) {
                statusCell.innerText = '达标';
                statusCell.style.color = 'var(--primary)';
            } else {
                statusCell.innerText = '未达标';
                statusCell.style.color = 'var(--danger)';
                statusCell.style.fontWeight = 'bold';
            }
        }

        // 渲染数据来源台账
        function renderSourceTable() {
            const tbody = document.getElementById('sourceBody');
            if(state.reports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5">暂无解析数据</td></tr>`;
                return;
            }
            tbody.innerHTML = state.reports.map(r => `
                <tr>
                    <td>${r.year}</td>
                    <td>有组织、无组织 (自动推断)</td>
                    <td>${r.unit}</td>
                    <td>${r.date}</td>
                    <td>${r.code}</td>
                </tr>
            `).join('');
        }

        // 初始渲染
        renderYears();
    </script>
</body>
</html>
